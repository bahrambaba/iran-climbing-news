name: Crawl Iranian Climbing News

on:
  schedule:
    # Every 6 hours: 00:00, 06:00, 12:00, 18:00 UTC
    - cron: '0 0,6,12,18 * * *'
  workflow_dispatch:  # Manual trigger

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify Telegram token
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          echo "Token length: ${#BOT_TOKEN}"
          echo "Token format check: $(echo $BOT_TOKEN | grep -cE '^[0-9]+:[A-Za-z0-9_-]+$')"
          curl -s "https://api.telegram.org/bot${BOT_TOKEN}/getMe" | python -c "import sys,json; d=json.load(sys.stdin); print(f'Bot OK: {d.get(\"ok\")} name={d.get(\"result\",{}).get(\"username\",\"?\")}')" 2>&1 || echo "getMe failed"

      - name: Run crawler
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python main.py

      - name: Save seen URLs cache
        if: always()
        uses: actions/cache@v4
        with:
          path: seen_urls.json
          key: seen-${{ github.run_id }}
          restore-keys: seen-
          enableCrossOsArchive: true
